server.port=7002

# MySQL - dùng database riêng cho mục 5 (tự tạo nếu chưa có). Đổi password nếu máy bạn khác.
spring.datasource.url=jdbc:mysql://localhost:3306/muc5_graphql?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=12345
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# GraphQL endpoint: /graphql, giao diện test: /graphiql
spring.graphql.graphiql.enabled=true
spring.graphql.graphiql.path=/graphiql
spring.graphql.path=/graphql

# Upload ảnh
storage.location=upload-dir
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
