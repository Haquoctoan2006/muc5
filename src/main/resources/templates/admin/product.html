<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quản lý Product - GraphQL</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
</head>
<body class="container mt-4">

<nav class="mb-3">
    <a href="/">Trang chủ</a> |
    <a href="/admin/category">Quản lý Category</a> |
    <a href="/admin/product">Quản lý Product</a>
</nav>

<h3>Quản lý Product (GraphQL)</h3>

<div class="row mb-3 g-2">
    <div class="col-md-3">
        <input type="text" id="keyword" class="form-control" placeholder="Tìm theo tên sản phẩm">
    </div>
    <div class="col-md-3">
        <select id="filterCategory" class="form-select"><option value="">-- Tất cả Category --</option></select>
    </div>
    <div class="col-md-2">
        <select id="sortByPrice" class="form-select">
            <option value="">-- Không sắp xếp --</option>
            <option value="asc">Giá tăng dần</option>
            <option value="desc">Giá giảm dần</option>
        </select>
    </div>
    <div class="col-md-2">
        <button class="btn btn-primary w-100" id="btnSearch">Tìm kiếm</button>
    </div>
    <div class="col-md-2">
        <button class="btn btn-success w-100" id="btnAdd">+ Thêm</button>
    </div>
</div>

<table class="table table-striped table-bordered align-middle">
    <thead><tr><th>Id</th><th>Ảnh</th><th>Tên</th><th>Giá</th><th>SL</th><th>Category</th><th>Actions</th></tr></thead>
    <tbody id="tableBody"></tbody>
</table>

<nav><ul class="pagination" id="pagination"></ul></nav>

<div class="modal fade" tabindex="-1" id="productModal">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalTitle">Thêm Product</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body row g-2">
        <input type="hidden" id="p_productId">
        <div class="col-md-6">
          <label class="form-label">Tên sản phẩm</label>
          <input type="text" class="form-control" id="p_productName">
        </div>
        <div class="col-md-6">
          <label class="form-label">Category</label>
          <select class="form-select" id="p_categoryId"></select>
        </div>
        <div class="col-md-4">
          <label class="form-label">Đơn giá</label>
          <input type="number" min="0" step="0.01" class="form-control" id="p_unitPrice">
        </div>
        <div class="col-md-4">
          <label class="form-label">Số lượng</label>
          <input type="number" min="0" class="form-control" id="p_quantity">
        </div>
        <div class="col-md-4">
          <label class="form-label">Giảm giá (%)</label>
          <input type="number" min="0" max="100" step="0.01" class="form-control" id="p_discount" value="0">
        </div>
        <div class="col-md-12">
          <label class="form-label">Mô tả</label>
          <textarea class="form-control" id="p_description"></textarea>
        </div>
        <div class="col-md-12">
          <label class="form-label">Ảnh (tùy chọn)</label>
          <input type="file" class="form-control" id="p_imageFile" accept="image/*">
          <div class="form-text">Khi sửa: để trống nếu muốn giữ ảnh cũ.</div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-primary" id="btnSave">Lưu</button>
        <button class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
var GRAPHQL_URL = "/graphql";
var currentPage = 0;
var isEditMode = false;
var cache = {};   // productId -> object (dùng cho nút Sửa)

function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (ch) {
        return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[ch];
    });
}

function gql(query, variables) {
    return $.ajax({
        url: GRAPHQL_URL,
        type: 'POST',
        contentType: 'application/json',
        data: JSON.stringify({ query: query, variables: variables || {} })
    }).then(function (resp) {
        if (resp.errors && resp.errors.length) {
            return $.Deferred().reject(resp.errors[0].message).promise();
        }
        return resp.data;
    }, function (xhr) {
        return $.Deferred().reject('Lỗi kết nối server (' + xhr.status + ')').promise();
    });
}

function uploadImage(file) {
    var fd = new FormData();
    fd.append('file', file);
    return $.ajax({ url: '/api/upload', type: 'POST', data: fd, processData: false, contentType: false });
}

function modal() {
    return bootstrap.Modal.getOrCreateInstance(document.getElementById('productModal'));
}

function loadCategoryOptions() {
    gql("{ categories { categoryId categoryName } }").done(function (data) {
        var opt1 = ['<option value="">-- Tất cả Category --</option>'];
        var opt2 = [];
        data.categories.forEach(function (c) {
            var o = '<option value="' + esc(c.categoryId) + '">' + esc(c.categoryName) + '</option>';
            opt1.push(o);
            opt2.push(o);
        });
        $('#filterCategory').html(opt1.join(''));
        $('#p_categoryId').html(opt2.join(''));
    }).fail(function (msg) { alert(msg); });
}

function searchProduct(page) {
    currentPage = page;
    var q = "query($keyword: String, $categoryId: ID, $page: Int, $size: Int, $sortByPrice: String) { " +
        "productsSearch(keyword: $keyword, categoryId: $categoryId, page: $page, size: $size, sortByPrice: $sortByPrice) { " +
        "content { productId productName unitPrice quantity discount description images category { categoryId categoryName } } " +
        "totalPages currentPage } }";
    var vars = {
        keyword: $('#keyword').val(),
        page: page,
        size: 5,
        sortByPrice: $('#sortByPrice').val() || null
    };
    var categoryId = $('#filterCategory').val();
    if (categoryId) vars.categoryId = categoryId;

    gql(q, vars).done(function (data) {
        var res = data.productsSearch;
        // vừa xóa hết dòng ở trang cuối -> lùi 1 trang
        if (res.content.length === 0 && page > 0) {
            searchProduct(page - 1);
            return;
        }
        renderTable(res.content);
        renderPagination(res.totalPages, page);
    }).fail(function (msg) { alert(msg); });
}

function renderTable(list) {
    var tr = [];
    list.forEach(function (p) {
        cache[p.productId] = p;
        var img = p.images ? '<img src="/admin/products/images/' + encodeURIComponent(p.images) + '" style="width:50px">' : '';
        tr.push('<tr><td>' + esc(p.productId) + '</td><td>' + img + '</td><td>' + esc(p.productName) + '</td><td>' +
            Number(p.unitPrice).toLocaleString('vi-VN') + '</td><td>' + esc(p.quantity) + '</td><td>' +
            esc(p.category ? p.category.categoryName : '') + '</td><td>' +
            '<button class="btn btn-warning btn-sm btn-edit" data-id="' + esc(p.productId) + '">Sửa</button> ' +
            '<button class="btn btn-danger btn-sm btn-delete" data-id="' + esc(p.productId) + '">Xóa</button>' +
            '</td></tr>');
    });
    if (list.length === 0) {
        tr.push('<tr><td colspan="7" class="text-center text-muted">Không có dữ liệu</td></tr>');
    }
    $('#tableBody').html(tr.join(''));
}

function renderPagination(totalPages, page) {
    var li = [];
    for (var i = 0; i < totalPages; i++) {
        li.push('<li class="page-item ' + (i === page ? 'active' : '') + '">' +
            '<a class="page-link" href="#" data-page="' + i + '">' + (i + 1) + '</a></li>');
    }
    $('#pagination').html(li.join(''));
}

function showCreateModal() {
    isEditMode = false;
    $('#p_productId,#p_productName,#p_unitPrice,#p_quantity,#p_description,#p_imageFile').val('');
    $('#p_discount').val(0);
    $('#modalTitle').text('Thêm Product');
    modal().show();
}

function showEditModal(p) {
    isEditMode = true;
    $('#p_productId').val(p.productId);
    $('#p_productName').val(p.productName);
    $('#p_categoryId').val(p.category ? p.category.categoryId : '');
    $('#p_unitPrice').val(p.unitPrice);
    $('#p_quantity').val(p.quantity);
    $('#p_discount').val(p.discount);
    $('#p_description').val(p.description);
    $('#p_imageFile').val('');
    $('#modalTitle').text('Cập nhật Product');
    modal().show();
}

function doSave(imageName) {
    var input = {
        productId: $('#p_productId').val() || null,
        productName: $.trim($('#p_productName').val()),
        categoryId: $('#p_categoryId').val(),
        unitPrice: parseFloat($('#p_unitPrice').val()),
        quantity: parseInt($('#p_quantity').val(), 10),
        discount: parseFloat($('#p_discount').val() || 0),
        description: $('#p_description').val(),
        images: imageName
    };
    var mutation = isEditMode
        ? "mutation($product: ProductInput) { updateProduct(product: $product) { productId } }"
        : "mutation($product: ProductInput) { createProduct(product: $product) { productId } }";
    gql(mutation, { product: input }).done(function () {
        modal().hide();
        searchProduct(isEditMode ? currentPage : 0);
    }).fail(function (msg) { alert(msg); });
}

function saveProduct() {
    if (!$.trim($('#p_productName').val())) { alert('Tên sản phẩm không được để trống'); return; }
    if (!$('#p_categoryId').val()) { alert('Vui lòng chọn Category (hãy tạo Category trước)'); return; }
    if ($('#p_unitPrice').val() === '' || isNaN(parseFloat($('#p_unitPrice').val()))) { alert('Vui lòng nhập đơn giá'); return; }
    if ($('#p_quantity').val() === '' || isNaN(parseInt($('#p_quantity').val(), 10))) { alert('Vui lòng nhập số lượng'); return; }

    var file = $('#p_imageFile')[0].files[0];
    if (file) {
        uploadImage(file).done(function (r) {
            doSave(r.fileName);
        }).fail(function (xhr) {
            alert((xhr.responseJSON && xhr.responseJSON.message) || 'Lỗi upload ảnh');
        });
    } else {
        doSave(null);
    }
}

function deleteProduct(id) {
    if (!confirm('Bạn có chắc muốn xóa sản phẩm này?')) return;
    gql("mutation($id: ID!) { deleteProductById(id: $id) }", { id: id }).done(function () {
        searchProduct(currentPage);
    }).fail(function (msg) { alert(msg); });
}

$(document).ready(function () {
    $('#btnSearch').on('click', function () { searchProduct(0); });
    $('#btnAdd').on('click', showCreateModal);
    $('#btnSave').on('click', saveProduct);
    $('#keyword').on('keypress', function (e) { if (e.which === 13) searchProduct(0); });
    $('#filterCategory, #sortByPrice').on('change', function () { searchProduct(0); });
    $('#tableBody').on('click', '.btn-edit', function () { showEditModal(cache[$(this).data('id')]); });
    $('#tableBody').on('click', '.btn-delete', function () { deleteProduct($(this).data('id')); });
    $('#pagination').on('click', '.page-link', function (e) {
        e.preventDefault();
        searchProduct(parseInt($(this).data('page'), 10));
    });
    loadCategoryOptions();
    searchProduct(0);
});
</script>
</body>
</html>
