<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trang chủ - GraphQL</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
</head>
<body class="container mt-4">

<nav class="mb-3">
    <a href="/">Trang chủ</a> |
    <a href="/admin/category">Quản lý Category</a> |
    <a href="/admin/product">Quản lý Product</a> |
    <a href="/graphiql" target="_blank">GraphiQL</a>
</nav>

<h3>Danh sách sản phẩm</h3>

<div class="row mb-2 g-2">
    <div class="col-md-4">
        <select id="filterCategory" class="form-select">
            <option value="">-- Tất cả Category --</option>
        </select>
    </div>
    <div class="col-md-3">
        <button class="btn btn-outline-secondary" id="btnAll">Hiện tất cả (giá tăng dần)</button>
    </div>
</div>
<p class="text-muted" id="modeText"></p>

<div class="row" id="productList"></div>

<script>
var GRAPHQL_URL = "/graphql";

function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (ch) {
        return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[ch];
    });
}

// Gọi GraphQL; lỗi (HTTP hoặc mảng "errors") đều được đưa về .fail(message)
function gql(query, variables) {
    return $.ajax({
        url: GRAPHQL_URL,
        type: 'POST',
        contentType: 'application/json',
        data: JSON.stringify({ query: query, variables: variables || {} })
    }).then(function (resp) {
        if (resp.errors && resp.errors.length) {
            return $.Deferred().reject(resp.errors[0].message).promise();
        }
        return resp.data;
    }, function (xhr) {
        return $.Deferred().reject('Lỗi kết nối server (' + xhr.status + ')').promise();
    });
}

function loadCategories() {
    gql("{ categories { categoryId categoryName } }").done(function (data) {
        var opts = ['<option value="">-- Tất cả Category --</option>'];
        data.categories.forEach(function (c) {
            opts.push('<option value="' + c.categoryId + '">' + esc(c.categoryName) + '</option>');
        });
        $('#filterCategory').html(opts.join(''));
    }).fail(function (msg) { alert(msg); });
}

function renderProducts(list) {
    if (!list || list.length === 0) {
        $('#productList').html('<div class="col-12 text-muted">Không có sản phẩm nào.</div>');
        return;
    }
    var html = [];
    list.forEach(function (p) {
        var img = p.images
            ? '<img src="/admin/products/images/' + encodeURIComponent(p.images) + '" class="card-img-top" style="height:150px;object-fit:cover">'
            : '<div class="bg-light text-center text-muted d-flex align-items-center justify-content-center" style="height:150px">Không có ảnh</div>';
        html.push('<div class="col-md-3 col-sm-6 mb-3"><div class="card h-100">' + img +
            '<div class="card-body">' +
            '<h6 class="card-title">' + esc(p.productName) + '</h6>' +
            '<p class="card-text text-danger fw-bold mb-1">' + Number(p.unitPrice).toLocaleString('vi-VN') + ' đ</p>' +
            '<p class="card-text small text-muted mb-0">' + esc(p.category ? p.category.categoryName : '') + '</p>' +
            '</div></div></div>');
    });
    $('#productList').html(html.join(''));
}

// Yêu cầu 1: tất cả product, giá từ thấp đến cao
function loadSortedByPriceAsc() {
    var q = "{ productsSortedByPriceAsc { productId productName unitPrice images category { categoryName } } }";
    gql(q).done(function (data) {
        renderProducts(data.productsSortedByPriceAsc);
        $('#modeText').text('Tất cả sản phẩm - giá từ thấp đến cao (' + data.productsSortedByPriceAsc.length + ')');
    }).fail(function (msg) { alert(msg); });
}

// Yêu cầu 2: tất cả product của 1 category
function loadByCategory(categoryId, categoryName) {
    var q = "query($categoryId: ID!) { productsByCategory(categoryId: $categoryId) " +
        "{ productId productName unitPrice images category { categoryName } } }";
    gql(q, { categoryId: categoryId }).done(function (data) {
        renderProducts(data.productsByCategory);
        $('#modeText').text('Category "' + categoryName + '" - giá từ thấp đến cao (' + data.productsByCategory.length + ')');
    }).fail(function (msg) { alert(msg); });
}

$(document).ready(function () {
    $('#filterCategory').on('change', function () {
        var id = $(this).val();
        if (!id) {
            loadSortedByPriceAsc();
        } else {
            loadByCategory(id, $(this).find('option:selected').text());
        }
    });
    $('#btnAll').on('click', function () {
        $('#filterCategory').val('');
        loadSortedByPriceAsc();
    });
    loadCategories();
    loadSortedByPriceAsc();
});
</script>
</body>
</html>
